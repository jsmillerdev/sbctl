name: linux test
description: >-
  The steps that the jobs of linux.yml share: Go, the build, the test command, then the test's log
  directory made readable and uploaded as an artifact, also when the test failed. The job checks out
  the repository first (this action is local) and does the set-up its test needs before the call
  (Node, the Supabase CLI, Garage, a sysctl). A step that must run only after a failure, such as
  `docker logs garage`, comes after the call with `if: failure()`.
inputs:
  name:
    description: The name of the step that runs the test, as the job log shows it.
    required: true
  run:
    description: The shell command that runs the test. It runs under bash -eo pipefail.
    required: true
  build-name:
    description: The name of the build step.
    default: build supavise
  build:
    description: The shell command that builds what the test runs (Go is set up before it).
    default: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
  logs:
    description: The directory that holds the test's logs (its LOG_DIR). Empty when the test leaves none.
    default: ""
  artifact:
    description: The name of the artifact that gets the logs; used when `logs` is set.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: ${{ inputs.build-name }}
      shell: bash
      run: ${{ inputs.build }}
    - name: ${{ inputs.name }}
      shell: bash
      run: ${{ inputs.run }}
    - if: always() && inputs.logs != ''
      name: collect logs
      shell: bash
      env:
        LOGS: ${{ inputs.logs }}
      run: sudo chmod -R a+rX "$LOGS" || true
    - if: always() && inputs.logs != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.logs }}
        if-no-files-found: ignore
