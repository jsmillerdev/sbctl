name: ci

on:
  push:
    branches: [main, "ws/**"]
  pull_request:
  # The nightly bump proposals start this workflow on their branches: a push made with a
  # workflow's GITHUB_TOKEN does not (.github/workflows/bump-proposals.yml).
  workflow_dispatch:

permissions:
  contents: read

# bash with -eo pipefail, so a failing command piped into tee fails the step.
defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      SUPAVISE_TEST_DATABASE_URL: postgres://postgres:pw@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # The WAL relay's push path reads a network body from a goroutine; a data race there depends
      # on timing, so the tests that cancel, truncate and replace sockets run many times under -race.
      - name: relay race regression
        run: go test -race -count=50 -run 'TestRelayTruncatedPushLeavesNothing|TestRelayCancelledAndTruncatedPushesDoNotRaceTheBody|TestRelayNeverReplacesASocketThatAnswers|TestRelayReconcileFollowsTheProjects|TestPushWALReaderStopsReadingBeforeItReturns' ./internal/backup
      - name: cross-build
        run: make build-linux

  # The CloudFormation template runs nowhere else in CI: this catches invalid properties,
  # condition keys and intrinsic functions before a stack is created from it.
  cfn-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: cfn-lint
        run: |
          python3 -m venv "$RUNNER_TEMP/cfn"
          "$RUNNER_TEMP/cfn/bin/pip" install --quiet cfn-lint
          "$RUNNER_TEMP/cfn/bin/cfn-lint" deploy/cloudformation/supavise.yaml

  # The drop-in AWS path (deploy/cloudformation/supavise.yaml, deploy/aws/deploy.sh, the release
  # assets). Nothing here calls AWS. checkov's generic rules run on the template; the few it
  # reports and we accept are skipped inline in the template, each with a reason. The Go tests
  # (deploy/cloudformation, deploy/aws) assert the parameter interface, the outputs, the retain
  # policies, the IAM scoping, deploy.sh's argument parsing and --dry-run output, and the release
  # assets. checkov is pinned so that a new upstream rule cannot turn this job red by itself.
  aws-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: checkov (security rules for the template)
        run: |
          python3 -m venv "$RUNNER_TEMP/checkov"
          "$RUNNER_TEMP/checkov/bin/pip" install --quiet checkov==3.3.25
          "$RUNNER_TEMP/checkov/bin/checkov" -f deploy/cloudformation/supavise.yaml --framework cloudformation --compact --quiet
      - name: shellcheck
        run: shellcheck deploy/aws/deploy.sh deploy/release-assets.sh deploy/release-gate.sh tests/conformance/propose-bumps.sh
      - name: template, deploy.sh and release assets
        run: go test -count=1 -v ./deploy/...

  # The workflow files themselves. actionlint is pinned; its own shellcheck pass is off because the
  # run: blocks of the older workflows carry findings that are not about this change.
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=

  functions-main:
    # The Deno main service of the Edge Runtime (internal/functions/mainservice/): format, lint, type check
    # and unit tests. The Go side embeds these files; internal/fleet tests keep the two in step.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.6.8
      - name: fmt
        run: deno fmt --check
        working-directory: internal/functions/mainservice
      - name: lint
        run: deno lint
        working-directory: internal/functions/mainservice
      - name: check
        run: deno check index.ts src/*.ts
        working-directory: internal/functions/mainservice
      - name: test
        run: deno test --allow-read --allow-write --allow-env src/
        working-directory: internal/functions/mainservice
