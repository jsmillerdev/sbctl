name: studio

# Builds platform-mode Studio (studio/build.sh) and runs the headless spike against it.
# Public-repo runners have 4 vCPU and 16 GB RAM; ci-prepare.sh adds swap and frees disk.
on:
  push:
    branches: [main, "ws/**", "integrate/**"]
    paths: ["studio/**", "internal/versions/versions.yaml", ".github/workflows/studio.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: prepare runner
        run: sudo env SUPAVISE_CI=1 studio/ci-prepare.sh   # sudo drops GITHUB_ACTIONS from the environment
      - name: build
        run: studio/build.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.platform }}
          path: studio/dist/
      - name: spike
        run: studio/spike.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-spike-${{ matrix.platform }}
          path: studio/.build-cache/spike/out
          if-no-files-found: ignore

  # The remote MCP endpoint end to end, on the Studio build the `build` job just made (amd64): the same
  # walk as the `oauth-smoke` job of linux.yml (tests/linux/oauth-smoke.sh) with Studio running from the
  # artifact, plus step L-09: MCP over Streamable HTTP at /mcp with two protocol revisions, a project-scoped
  # and an account-scoped URL, read_only, features, a personal access token as bearer, get_project_url and
  # create_project. It reuses the build's artifact, so it costs no second Studio build. `!cancelled()` runs
  # it when only the spike (or the arm64 build) failed; a missing amd64 artifact fails the download step.
  # The path filter above is Studio's, so a push that changes only the walk, the /mcp gate or the proxy
  # does not start this workflow: run it by hand (workflow_dispatch) after such a change and before a
  # release. The `oauth-smoke` job of linux.yml, which release-gate.sh requires, covers the same walk
  # without L-09 and the Studio checks.
  mcp-e2e:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: studio-linux-amd64
          path: /tmp/studio-dist
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: mcp end to end
        run: |
          ls -l /tmp/studio-dist
          sudo env "PATH=$PATH" LOG_DIR=/tmp/supavise-mcp-logs SUPAVISE_BIN=/tmp/supavise \
            tests/linux/oauth-smoke.sh --studio-artifact "$(ls /tmp/studio-dist/supavise-studio-*-linux-amd64.tar.zst)"
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-mcp-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-e2e
          path: /tmp/supavise-mcp-logs
          if-no-files-found: ignore
