name: release

# On a tag v*: require that the tagged commit has already passed its tests (the conformance suite
# and the upgrade test among them), build supavise for linux amd64 and arm64, build the Studio
# artifact, write the release manifest, sign the checksum list (which covers the manifest) with the
# ed25519 key in the repository secret SUPAVISE_SIGNING_KEY and publish everything as a GitHub
# release with generated notes. Nothing here runs unless someone pushes a tag.
#
# One-time setup (deploy/README.md, "Release signing"):
#   openssl genpkey -algorithm ed25519 -out supavise-signing.pem
#   openssl pkey -in supavise-signing.pem -pubout -out internal/selfupdate/release_key.pem   # commit this file
#   gh secret set SUPAVISE_SIGNING_KEY --env release < supavise-signing.pem                     # then delete the file
#
# The key lives in an Environment, not in a repository secret: a repository secret is readable by
# any workflow run that someone with write access starts from any branch, and this key is the
# root of trust for self-update and install.sh on every node. Create the Environment "release" in
# the repository settings with a deployment rule that admits only the tags v* (and, optionally, a
# required reviewer); the jobs below that read the key name it with `environment: release`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The tagged commit must have passed ci.yml, linux.yml (which holds the upgrade test) and
  # conformance.yml on this very commit. The gate reads those runs; it does not start them, so a
  # tag on a commit that never ran them fails here (deploy/release-gate.sh says what to do) and
  # nothing is built or published. It holds no secrets and uses no environment.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: tests passed on the tagged commit
        run: deploy/release-gate.sh "$GITHUB_SHA"

  check:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: tag looks like a version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1; }
      - name: the release key is committed and the secret is its private half
        env:
          SUPAVISE_SIGNING_KEY: ${{ secrets.SUPAVISE_SIGNING_KEY }}
        run: |
          openssl pkey -pubin -in internal/selfupdate/release_key.pem -noout 2>/dev/null \
            || { echo "internal/selfupdate/release_key.pem is not a public key: see deploy/README.md, Release signing"; exit 1; }
          [[ -n "$SUPAVISE_SIGNING_KEY" ]] || { echo "the secret SUPAVISE_SIGNING_KEY of the Environment release is not set: see deploy/README.md, Release signing"; exit 1; }
          umask 077
          printf '%s\n' "$SUPAVISE_SIGNING_KEY" > "$RUNNER_TEMP/sign.pem"
          a=$(openssl pkey -in "$RUNNER_TEMP/sign.pem" -pubout -outform DER | openssl dgst -sha256)
          b=$(openssl pkey -pubin -in internal/selfupdate/release_key.pem -pubout -outform DER | openssl dgst -sha256)
          rm -f "$RUNNER_TEMP/sign.pem"
          [[ "$a" == "$b" ]] || { echo "SUPAVISE_SIGNING_KEY does not match internal/selfupdate/release_key.pem"; exit 1; }
      - name: the next key, if there is one, is a valid second key
        run: |
          # internal/selfupdate/release_key_next.pem is empty outside a key rotation. When it holds a
          # key, that key must parse and must not be the current one (deploy/README.md, "Rotating the
          # release signing key").
          next=internal/selfupdate/release_key_next.pem
          for f in internal/selfupdate/release_key.pem "$next"; do
            if grep -q -e 'PRIVATE KEY' "$f"; then echo "$f contains a private key: remove it and treat that key as leaked"; exit 1; fi
            if grep -- '^-----BEGIN ' "$f" | grep -qv -e '-----BEGIN PUBLIC KEY-----'; then echo "$f holds a PEM block that is not a PUBLIC KEY"; exit 1; fi
          done
          if grep -q -- '-----BEGIN PUBLIC KEY-----' "$next"; then
            openssl pkey -pubin -in "$next" -noout 2>/dev/null || { echo "$next holds a PEM block that is not a public key"; exit 1; }
            a=$(openssl pkey -pubin -in "$next" -pubout -outform DER | openssl dgst -sha256)
            b=$(openssl pkey -pubin -in internal/selfupdate/release_key.pem -pubout -outform DER | openssl dgst -sha256)
            [[ "$a" != "$b" ]] || { echo "$next is the current key: a rotation needs a new key"; exit 1; }
            echo "key rotation under way: this release's binaries accept the current and the next key"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  binaries:
    needs: [check, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "dist/supavise-linux-$arch" ./cmd/supavise
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: supavise-binaries
          path: dist/
          if-no-files-found: error

  studio:
    needs: [check, gate]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: prepare runner
        run: sudo env SUPAVISE_CI=1 studio/ci-prepare.sh   # sudo drops GITHUB_ACTIONS from the environment
      - name: build
        run: studio/build.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.platform }}
          path: studio/dist/*.tar.zst
          if-no-files-found: error

  publish:
    needs: [binaries, studio]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write   # create the release and attach the assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the release notes read the history since the previous tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: collect
        run: |
          mkdir -p dist
          find parts -type f \( -name 'supavise-linux-*' -o -name 'supavise-studio-*.tar.zst' \) -exec cp {} dist/ \;
          ls -l dist
      - name: release tool (manifest, notes)
        run: go build -o "$RUNNER_TEMP/releasetool" ./deploy/releasetool
      - name: sign and stamp (deploy/release-assets.sh)
        env:
          SUPAVISE_SIGNING_KEY: ${{ secrets.SUPAVISE_SIGNING_KEY }}
          # The template of this release names this tag as its default supavise release.
          SUPAVISE_RELEASE_TAG: ${{ github.ref_name }}
          # Writes supavise-release.json (version, min_upgrade_from, the pinned Supabase releases) and
          # lists it in SHA256SUMS, so the signature below covers it.
          SUPAVISE_RELEASETOOL: ${{ runner.temp }}/releasetool
        run: |
          umask 077
          printf '%s\n' "$SUPAVISE_SIGNING_KEY" > "$RUNNER_TEMP/sign.pem"
          deploy/release-assets.sh dist "$RUNNER_TEMP/sign.pem" internal/selfupdate/release_key.pem
          shred -u "$RUNNER_TEMP/sign.pem" || rm -f "$RUNNER_TEMP/sign.pem"
          ls -l dist
          # The install path for AWS users: the template (console upload) and the deploy script.
          for f in supavise.yaml supavise-aws-deploy.sh supavise-release.json; do [[ -s "dist/$f" ]] || { echo "dist/$f is missing"; exit 1; }; done
      - name: release notes
        run: |
          # What Supavise changed since the previous tag, and a table of the Supabase service
          # versions that moved (internal/versions/versions.yaml at the two tags), each linked to
          # its upstream release. A stable release compares with the previous stable tag; a
          # pre-release with the previous tag of any kind.
          prev=""
          while read -r t; do
            [[ "$t" == "$GITHUB_REF_NAME" ]] && continue
            [[ "$GITHUB_REF_NAME" != *-* && "$t" == *-* ]] && continue
            prev=$t; break
          done < <(git tag --list 'v[0-9]*' --merged "$GITHUB_SHA" --sort=-creatordate)
          args=(notes -tag "$GITHUB_REF_NAME" -repo "$GITHUB_REPOSITORY" -new internal/versions/versions.yaml
                -min-upgrade-from "$(grep -v '^[[:space:]]*#' deploy/MIN_UPGRADE_FROM | tr -d '[:space:]')")
          if [[ -n "$prev" ]]; then
            git show "$prev:internal/versions/versions.yaml" > "$RUNNER_TEMP/old-versions.yaml"
            git log --no-merges --pretty=format:'%H%x09%s' "$prev..$GITHUB_SHA" > "$RUNNER_TEMP/log.txt"
            args+=(-prev-tag "$prev" -old "$RUNNER_TEMP/old-versions.yaml" -log "$RUNNER_TEMP/log.txt")
          else
            git log --no-merges -n 50 --pretty=format:'%H%x09%s' "$GITHUB_SHA" > "$RUNNER_TEMP/log.txt"
            args+=(-log "$RUNNER_TEMP/log.txt")
          fi
          "$RUNNER_TEMP/releasetool" "${args[@]}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$GITHUB_REF_NAME")
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
          fi

  # Optional: copy the release's CloudFormation template to a public S3 object, so the "Launch
  # Stack" link of deploy/README.md works, and print that link. It runs only when the repository
  # variables AWS_TEMPLATE_BUCKET and AWS_RELEASE_ROLE_ARN exist; without them the job is skipped
  # and the release is complete (the template and supavise-aws-deploy.sh are attached to it either
  # way). AWS_RELEASE_ROLE_ARN is an IAM role that trusts this repository's GitHub OIDC token for
  # the Environment "release" and may only s3:PutObject under templates/ of the bucket; the bucket
  # allows public reads of templates/ (CloudFormation fetches the template anonymously). The
  # optional variable AWS_TEMPLATE_REGION is the bucket's region (default us-east-1). The
  # commands that create the bucket, the policy and the role are in deploy/README.md, "Launch
  # Stack button". This workflow creates nothing in AWS.
  publish-template:
    needs: publish
    if: ${{ vars.AWS_TEMPLATE_BUCKET != '' && vars.AWS_RELEASE_ROLE_ARN != '' }}
    runs-on: ubuntu-24.04
    # The Environment is what the role's trust policy names (its tag rule admits only v* tags).
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ vars.AWS_TEMPLATE_BUCKET }}
      REGION: ${{ vars.AWS_TEMPLATE_REGION || 'us-east-1' }}
    steps:
      - name: download the template that the release carries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern supavise.yaml --dir "$RUNNER_TEMP/t"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.REGION }}
      - name: upload and print the Launch Stack link
        run: |
          src="$RUNNER_TEMP/t/supavise.yaml"
          keys=("templates/supavise-$GITHUB_REF_NAME.yaml")
          # supavise-latest.yaml is what the README button names: only stable releases move it.
          [[ "$GITHUB_REF_NAME" == *-* ]] || keys+=("templates/supavise-latest.yaml")
          for key in "${keys[@]}"; do
            aws s3 cp "$src" "s3://$BUCKET/$key" --content-type application/x-yaml --cache-control 'max-age=300'
            url="https://$BUCKET.s3.$REGION.amazonaws.com/$key"
            # CloudFormation reads the template without credentials: check that it can.
            curl -fsSL -o "$RUNNER_TEMP/t/check.yaml" "$url" \
              || { echo "::error::$url is not publicly readable: see deploy/README.md, Launch Stack button (bucket policy)"; exit 1; }
            cmp "$src" "$RUNNER_TEMP/t/check.yaml" || { echo "::error::the public object differs from the release's template"; exit 1; }
            enc=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$url")
            launch="https://$REGION.console.aws.amazon.com/cloudformation/home?region=$REGION#/stacks/create/review?templateURL=$enc&stackName=supavise"
            echo "Launch Stack ($key): $launch"
            {
              echo "### Launch Stack: \`$key\`"
              echo
              echo "[![Launch Stack](https://s3.amazonaws.com/cloudformation-examples/cloudformation-launch-stack.png)]($launch)"
              echo
              echo "The link creates the stack in $REGION. For another region use the console upload or deploy/aws/deploy.sh."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
