name: linux

# Linux-only verification that cannot run on a developer Mac: the systemd backend end to
# end, backups against a real Linux Postgres and S3 (MinIO), and ACME issuance (Pebble).
on:
  push:
    branches: [main, "ws/**", "integrate/**"]
  workflow_dispatch:

permissions:
  contents: read

# bash with -eo pipefail, so a failing command piped into tee fails the step.
defaults:
  run:
    shell: bash

jobs:
  systemd-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build sbctl
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/sbctl ./cmd/sbctl
      - name: systemd smoke
        run: sudo LOG_DIR=/tmp/sbctl-linux-logs SBCTL_BIN=/tmp/sbctl tests/linux/systemd-smoke.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/sbctl-linux-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemd-smoke-${{ matrix.arch }}
          path: /tmp/sbctl-linux-logs
          if-no-files-found: ignore

  backup-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # MinIO no longer publishes images or binaries (dl.min.io answers 410), and
      # SeaweedFS lists empty "directories" as prefixes, so the real S3 service is Garage:
      # a flat key namespace like AWS S3, one static binary.
      - name: start S3 (Garage)
        run: |
          mkdir -p /tmp/garage/meta /tmp/garage/data
          cat >/tmp/garage/garage.toml <<'TOML'
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "127.0.0.1:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          [s3_api]
          s3_region = "us-east-1"
          api_bind_addr = "127.0.0.1:9000"
          [admin]
          api_bind_addr = "127.0.0.1:3903"
          admin_token = "sbctl-ci-admin-token"
          TOML
          docker run -d --name garage --network host \
            -v /tmp/garage/garage.toml:/etc/garage.toml \
            -v /tmp/garage/meta:/var/lib/garage/meta -v /tmp/garage/data:/var/lib/garage/data \
            dxflrs/garage:v1.1.0
          for i in $(seq 1 60); do
            docker exec garage /garage status >/dev/null 2>&1 && break
            sleep 1
          done
          ID=$(docker exec garage /garage node id -q | cut -d@ -f1)
          docker exec garage /garage layout assign -z dc1 -c 1G "$ID"
          docker exec garage /garage layout apply --version 1
          docker exec garage /garage key import --yes -n ci GK0123456789abcdef01234567 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          docker exec garage /garage bucket create sbctl-test
          docker exec garage /garage bucket allow --read --write --owner sbctl-test --key ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          echo "S3 answered $code"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: backup integration
        env:
          SBCTL_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          SBCTL_TEST_S3_BUCKET: sbctl-test
          SBCTL_TEST_S3_ACCESS_KEY: GK0123456789abcdef01234567
          SBCTL_TEST_S3_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: internal/backup/ci-integration.sh
      - if: failure()
        run: docker logs garage | tail -50

  pebble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: internal/proxy/pebble-test.sh

  fleet-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build sbctl
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/sbctl ./cmd/sbctl
      - name: fleet smoke
        run: sudo LOG_DIR=/tmp/sbctl-fleet-logs SBCTL_BIN=/tmp/sbctl tests/linux/fleet-smoke.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/sbctl-fleet-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-smoke-${{ matrix.arch }}
          path: /tmp/sbctl-fleet-logs
          if-no-files-found: ignore

  # Branch clones on real filesystems: copy-on-write on XFS (a loop file with reflink=1) and
  # the base-backup fallback on the runner's ext4 root, each with a parent of about 1 GB; then
  # the egress isolation of a branch with data under real systemd units.
  branching-xfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: branch clones on XFS and ext4
        run: tests/linux/branching-xfs.sh
      # A branch with data cannot reach the outside world: IPAddressDeny on its Postgres unit,
      # pg_cron jobs paused, a pg_net request to a non-loopback address fails (needs systemd).
      - name: branch egress isolation under systemd
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/sbctl ./cmd/sbctl
          sudo LOG_DIR=/tmp/sbctl-egress-logs SBCTL_BIN=/tmp/sbctl tests/linux/branching-egress.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/sbctl-egress-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branching-egress
          path: /tmp/sbctl-egress-logs
          if-no-files-found: ignore
