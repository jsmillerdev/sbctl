name: linux

# Linux-only verification that cannot run on a developer Mac: the systemd backend end to
# end, backups against a real Linux Postgres and S3 (MinIO), and ACME issuance (Pebble).
on:
  push:
    branches: [main, "ws/**", "integrate/**"]
  workflow_dispatch:

permissions:
  contents: read

# bash with -eo pipefail, so a failing command piped into tee fails the step.
defaults:
  run:
    shell: bash

jobs:
  systemd-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build sbctl
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/sbctl ./cmd/sbctl
      - name: systemd smoke
        run: sudo LOG_DIR=/tmp/sbctl-linux-logs SBCTL_BIN=/tmp/sbctl tests/linux/systemd-smoke.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/sbctl-linux-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemd-smoke-${{ matrix.arch }}
          path: /tmp/sbctl-linux-logs
          if-no-files-found: ignore

  backup-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: start S3 (SeaweedFS; the MinIO image is no longer published)
        run: |
          printf '%s' '{"identities":[{"name":"ci","credentials":[{"accessKey":"sbctltest","secretKey":"sbctltestsecret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
          docker run -d --name s3 -p 8333:8333 -v /tmp/s3.json:/etc/s3.json chrislusf/seaweedfs server -s3 -s3.config=/etc/s3.json -dir=/data
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:8333 && break; sleep 1; done
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: create bucket
        env:
          AWS_ACCESS_KEY_ID: sbctltest
          AWS_SECRET_ACCESS_KEY: sbctltestsecret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for i in $(seq 1 30); do aws --endpoint-url http://127.0.0.1:8333 s3 mb s3://sbctl-test && break; sleep 2; done
          aws --endpoint-url http://127.0.0.1:8333 s3 ls
      - name: backup integration
        env:
          SBCTL_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          SBCTL_TEST_S3_BUCKET: sbctl-test
          SBCTL_TEST_S3_ACCESS_KEY: sbctltest
          SBCTL_TEST_S3_SECRET_KEY: sbctltestsecret
        run: internal/backup/ci-integration.sh

  pebble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: internal/proxy/pebble-test.sh
