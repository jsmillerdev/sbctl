name: linux

# Linux-only verification that cannot run on a developer Mac: the systemd backend end to
# end, backups against a real Linux Postgres and S3 (MinIO), and ACME issuance (Pebble).
on:
  push:
    branches: [main, "ws/**", "integrate/**"]
  workflow_dispatch:

permissions:
  contents: read

# bash with -eo pipefail, so a failing command piped into tee fails the step.
defaults:
  run:
    shell: bash

jobs:
  systemd-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: systemd smoke
        run: sudo LOG_DIR=/tmp/supavise-linux-logs SUPAVISE_BIN=/tmp/supavise tests/linux/systemd-smoke.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-linux-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemd-smoke-${{ matrix.arch }}
          path: /tmp/supavise-linux-logs
          if-no-files-found: ignore

  backup-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # MinIO no longer publishes images or binaries (dl.min.io answers 410), and
      # SeaweedFS lists empty "directories" as prefixes, so the real S3 service is Garage:
      # a flat key namespace like AWS S3, one static binary.
      - name: start S3 (Garage)
        run: |
          mkdir -p /tmp/garage/meta /tmp/garage/data
          cat >/tmp/garage/garage.toml <<'TOML'
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "127.0.0.1:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          [s3_api]
          s3_region = "us-east-1"
          api_bind_addr = "127.0.0.1:9000"
          [admin]
          api_bind_addr = "127.0.0.1:3903"
          admin_token = "supavise-ci-admin-token"
          TOML
          docker run -d --name garage --network host \
            -v /tmp/garage/garage.toml:/etc/garage.toml \
            -v /tmp/garage/meta:/var/lib/garage/meta -v /tmp/garage/data:/var/lib/garage/data \
            dxflrs/garage:v1.1.0
          for i in $(seq 1 60); do
            docker exec garage /garage status >/dev/null 2>&1 && break
            sleep 1
          done
          ID=$(docker exec garage /garage node id -q | cut -d@ -f1)
          docker exec garage /garage layout assign -z dc1 -c 1G "$ID"
          docker exec garage /garage layout apply --version 1
          docker exec garage /garage key import --yes -n ci GK0123456789abcdef01234567 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          docker exec garage /garage bucket create supavise-test
          docker exec garage /garage bucket allow --read --write --owner supavise-test --key ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          echo "S3 answered $code"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: backup integration
        env:
          SUPAVISE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          SUPAVISE_TEST_S3_BUCKET: supavise-test
          SUPAVISE_TEST_S3_ACCESS_KEY: GK0123456789abcdef01234567
          SUPAVISE_TEST_S3_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: internal/backup/ci-integration.sh
      - if: failure()
        run: docker logs garage | tail -50

  pebble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Real ACME against Pebble: the node's own hosts, and a customer's custom hostname taken from
      # initialize to activation (DNS stub: pebble-challtestsrv), fetched over its certificate.
      - name: pebble ACME issuance and custom hostnames
        run: internal/proxy/pebble-test.sh

  fleet-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: fleet smoke
        run: sudo LOG_DIR=/tmp/supavise-fleet-logs SUPAVISE_BIN=/tmp/supavise tests/linux/fleet-smoke.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-fleet-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-smoke-${{ matrix.arch }}
          path: /tmp/supavise-fleet-logs
          if-no-files-found: ignore

  # Dashboard writes under systemd: settings saved through the Management API change the
  # behavior of GoTrue, PostgREST, Storage, Realtime and Postgres; keys, the database password
  # and persistence across a pause.
  settings-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: settings smoke
        run: sudo LOG_DIR=/tmp/supavise-settings-logs SUPAVISE_BIN=/tmp/supavise tests/linux/settings-smoke.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-settings-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-smoke-${{ matrix.arch }}
          path: /tmp/supavise-settings-logs
          if-no-files-found: ignore

  # Per-project compute sizes under systemd on an XFS data volume with prjquota: Micro to Small
  # through the Management API (RESIZING, the unit's MemoryMax and CPUQuota, Postgres's settings,
  # the Supavisor tenant's pool, the data, the other project untouched), Medium and Large, a size
  # the node cannot hold refused, a downsize Postgres cannot start on rolled back, the CLI beside
  # the daemon, and the project's disk size as an XFS quota that stops a write.
  compute-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: compute smoke
        run: sudo LOG_DIR=/tmp/supavise-compute-logs SUPAVISE_BIN=/tmp/supavise tests/linux/compute-smoke.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-compute-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compute-smoke-${{ matrix.arch }}
          path: /tmp/supavise-compute-logs
          if-no-files-found: ignore

  # Backups and point-in-time restore through the Management API under systemd: the backup list
  # and the PITR add-on, a restore to a time between two writes (RESTORING, a second restore refused,
  # ACTIVE_HEALTHY, the data of that time), then a restore from the listed base backup.
  backups-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: backups smoke
        run: sudo LOG_DIR=/tmp/supavise-backups-logs SUPAVISE_BIN=/tmp/supavise tests/linux/backups-smoke.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-backups-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backups-smoke-${{ matrix.arch }}
          path: /tmp/supavise-backups-logs
          if-no-files-found: ignore

  # Project upgrades under systemd through the Management API and the CLI: projects created on
  # older GoTrue and PostgREST releases than the node's pins (real slim-services releases), kept on
  # them by a node update, an upgrade onto a release that does not start that is rolled back, the
  # upgrade that works (versions, processes, data and the auth user intact, PostgreSQL untouched),
  # the CLI's `projects upgrade --all`, and artifact garbage collection.
  upgrade-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: upgrade smoke
        run: sudo LOG_DIR=/tmp/supavise-upgrade-logs SUPAVISE_BIN=/tmp/supavise tests/linux/upgrade-smoke.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-upgrade-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-smoke-${{ matrix.arch }}
          path: /tmp/supavise-upgrade-logs
          if-no-files-found: ignore

  # The node upgrade on a node the installer set up from the previous release (origin/main with older
  # pins): `supavise upgrade --check`, `--plan` and the refusals, the upgrade to a release served by a
  # local server (binary, shared services, projects with a canary; versions, processes, data, the kept
  # releases), a release whose daemon dies and one whose PostgREST does not start (rolled back, exit
  # status 3), and `supavise rollback` with the registry rule. The job's name starts with `upgrade`:
  # the release gate (deploy/release-gate.sh) requires the jobs of this name.
  upgrade-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      # The whole history: the previous release is origin/main as this branch last merged it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build the previous release and the releases it is upgraded to
        run: tests/linux/upgrade-e2e-build.sh /tmp/upgrade-bins
      - name: upgrade end to end
        run: sudo LOG_DIR=/tmp/supavise-upgrade-e2e-logs UPGRADE_E2E_BIN_DIR=/tmp/upgrade-bins tests/linux/upgrade-e2e.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-upgrade-e2e-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-e2e-${{ matrix.arch }}
          path: /tmp/supavise-upgrade-e2e-logs
          if-no-files-found: ignore

  # Members and roles under systemd: users with each role, Studio's permission list, a Read-only
  # PAT refused writes through the API, the real MCP server and Supabase CLI, invitations by mail.
  roles-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Supabase CLI (the version the API is tested with)
        run: |
          npm install --prefix /tmp/sbcli supabase@2.119.0
          /tmp/sbcli/node_modules/.bin/supabase --version
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: roles smoke
        run: sudo env "PATH=$PATH" LOG_DIR=/tmp/supavise-roles-logs SUPAVISE_BIN=/tmp/supavise SUPABASE_CLI=/tmp/sbcli/node_modules/.bin/supabase REQUIRE_CLIENTS=1 tests/linux/roles-smoke.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-roles-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roles-smoke-${{ matrix.arch }}
          path: /tmp/supavise-roles-logs
          if-no-files-found: ignore

  # Single sign-on under systemd against a real SAML identity provider (SimpleSAMLphp in a
  # container; the image is amd64 only): the dashboard's providers and default roles, a person
  # of an unmapped domain waiting for approval, closed sign-up, Studio's SSO button, and a
  # project's providers through the real Supabase CLI and an end user's sign-in.
  sso-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Supabase CLI (the version the API is tested with)
        run: |
          npm install --prefix /tmp/sbcli supabase@2.119.0
          /tmp/sbcli/node_modules/.bin/supabase --version
      # Pinned by digest (the manifest of the image's last tag, from the Docker Hub registry API): the job runs
      # it with sudo, so a changed tag must not change what runs. tests/linux/sso-smoke.sh names the same digest.
      - name: identity provider image
        run: docker pull kristophjunge/test-saml-idp@sha256:02a6e56c01f94b9ba3f2151f33acedf4606ac9b7eeb62a874c5a6b032c0fa9cc
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: sso smoke
        run: sudo env "PATH=$PATH" LOG_DIR=/tmp/supavise-sso-logs SUPAVISE_BIN=/tmp/supavise SUPABASE_CLI=/tmp/sbcli/node_modules/.bin/supabase tests/linux/sso-smoke.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-sso-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sso-smoke
          path: /tmp/supavise-sso-logs
          if-no-files-found: ignore

  # The installer on a fresh VM: deploy/install.sh, the claim flow, a project through the
  # Management API with a PAT, REST through the proxy, the pooler, a re-run, self-update.
  install-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build supavise v0.0.1, v0.0.2 (installer upgrade) and v0.0.3 (self-update target)
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=v0.0.1" -o /tmp/supavise ./cmd/supavise
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=v0.0.2" -o /tmp/supavise-v2 ./cmd/supavise
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=v0.0.3" -o /tmp/supavise-v3 ./cmd/supavise
          # deploy/release-assets.sh writes the signed release manifest with this (root has no Go toolchain).
          go build -o /tmp/releasetool ./deploy/releasetool
      - name: install end to end
        run: sudo LOG_DIR=/tmp/supavise-install-logs SUPAVISE_BIN=/tmp/supavise SUPAVISE_BIN_V2=/tmp/supavise-v2 SUPAVISE_BIN_V3=/tmp/supavise-v3 SUPAVISE_RELEASETOOL=/tmp/releasetool tests/linux/install-e2e.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-install-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-e2e-${{ matrix.arch }}
          path: /tmp/supavise-install-logs
          if-no-files-found: ignore

  # Unattended OS security updates on the distributions we support: the apt configuration that
  # `supavise system os-updates` writes, read back through apt-config and through unattended-upgrade
  # itself, on Ubuntu 24.04 and Debian 12 and 13 (containers; the install-e2e job covers the
  # timers and the installer on a VM).
  os-updates:
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "debian:13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: os-updates in ${{ matrix.image }}
        run: docker run --rm -v /tmp/supavise:/supavise:ro -v "$PWD":/repo:ro "${{ matrix.image }}" bash /repo/tests/linux/os-updates.sh

  functions-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: functions smoke
        run: sudo LOG_DIR=/tmp/supavise-functions-logs SUPAVISE_BIN=/tmp/supavise tests/linux/functions-smoke.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-functions-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-smoke-${{ matrix.arch }}
          path: /tmp/supavise-functions-logs
          if-no-files-found: ignore

  # Branch clones on real filesystems: copy-on-write on XFS (a loop file with reflink=1) and
  # the base-backup fallback on the runner's ext4 root, each with a parent of about 1 GB; then
  # the egress isolation of a branch with data under real systemd units.
  branching-xfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The test clusters use ports 39000-39999, which lie inside Linux's ephemeral range: a client
      # socket (a database or HTTP connection of the test, or of a service) that the kernel gives
      # one of those ports stops a cluster started later from binding it ("address already in
      # use"). Reserving the range keeps the allocator off it; binding to it explicitly still works.
      - name: keep the test ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=39000-39999
      - name: branch clones on XFS and ext4
        run: tests/linux/branching-xfs.sh
      # A branch with data cannot reach the outside world: IPAddressDeny on its Postgres unit,
      # pg_cron jobs paused, a pg_net request to a non-loopback address fails (needs systemd).
      - name: branch egress isolation under systemd
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
          sudo LOG_DIR=/tmp/supavise-egress-logs SUPAVISE_BIN=/tmp/supavise tests/linux/branching-egress.sh
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-egress-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branching-egress
          path: /tmp/supavise-egress-logs
          if-no-files-found: ignore

  # The replica data plane on real clusters, one machine playing two nodes: a standby seeded from a
  # base backup, streaming, PostgREST on the standby seeing DDL within the reload interval, a
  # switchover (promote and demote in place), pg_cron and pg_net idle on a standby.
  replica-blocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The test clusters use ports 39000-39999, which lie inside Linux's ephemeral range (see
      # branching-xfs).
      - name: keep the test ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=39000-39999
      - name: replica blocks
        run: tests/linux/replica-blocks.sh
