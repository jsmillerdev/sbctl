name: footprint

# Measures memory and cold start at several project counts under real systemd.
on:
  workflow_dispatch:
    inputs:
      sizes:
        description: project counts
        default: "10 25 50"
      class:
        description: project class
        default: default

permissions:
  contents: read

# bash with -eo pipefail, so a failing command piped into tee fails the step.
defaults:
  run:
    shell: bash

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: host facts
        run: nproc; free -m; df -h /; uname -a
      - name: measure
        run: sudo SUPAVISE_BIN=/tmp/supavise tests/linux/footprint.sh --sizes "${{ inputs.sizes }}" --class "${{ inputs.class }}" | tee /tmp/footprint.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footprint-${{ matrix.arch }}
          path: /tmp/footprint.md
          if-no-files-found: ignore
